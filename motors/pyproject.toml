[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fed_learn_ipmsm"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "flwr >= 1.25.0",
    "pandas",
    "scikit-learn",
    "torch >= 2.8.0",
]

[tool.setuptools]
package-dir = {"" = "motors"}

[tool.flwr.app]
publisher = "barretoleme"

[tool.flwr.app.components]
# Using dot notation to point through the 'code' package
clientapp = "src.client:app"
serverapp = "src.server:app"


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

# [tool.flwr.federations]
# default = "local-simulation"

# [tool.flwr.federations.local-simulation]
# options.num-supernodes = 3

# [tool.flwr.federations.local-simulation-gpu]
# options.num-supernodes = 3
# options.backend.client-resources.num-cpus = 1
# options.backend.client-resources.num-gpus = 0

[tool.flwr.app.config]
num-server-rounds = 100
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.001
batch-size = 128

RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO=0